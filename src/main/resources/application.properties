spring.application.name=RideMatch

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ridematch_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development schema behavior: create missing tables and update changed mappings.
# Replace with validate after the schema is under migration control.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false

# Matching uses normalized text and these configurable alias groups, not a map API.
ridematch.matching.maximum-departure-difference=15m
ridematch.matching.replacement-search-timeout=2m
ridematch.matching.nearby-destination-groups[0]=Sector 99|Noida Sector 99|Sector 100|Noida Sector 100
ridematch.matching.nearby-destination-groups[1]=Sector 128|JIIT Sector 128|Jaypee Institute Sector 128

# Potential-loss assessments are review flags only; RideMatch never charges users.
ridematch.cancellation.potential-loss-review-window=24h
