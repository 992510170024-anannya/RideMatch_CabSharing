<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ride details and group')}"></head>
<body><nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="page-shell">
  <div th:if="${notice}" class="alert alert-success" role="status" th:text="${notice}"></div>
  <div th:if="${policyMessage}" class="alert alert-info" role="status" th:text="${policyMessage}"></div>
  <header class="page-heading d-flex flex-column flex-lg-row justify-content-between gap-3">
    <div><span class="eyebrow" th:text="|Ride #${group.ride.id} · ${group.ride.status}|">Ride status</span>
      <h1 class="route-line mt-2" th:text="|${group.ride.pickupLocation} → ${group.ride.destination}|">Ride route</h1>
      <p th:text="|${group.ride.travelDate} at ${group.ride.departureTime}|">Departure</p></div>
    <div class="d-flex gap-2 flex-wrap align-self-start" th:if="${group.coordinator and group.ride.status.name() != 'CANCELLED' and group.ride.status.name() != 'COMPLETED'}">
      <form th:if="${group.ride.status.name() != 'TAXI_ARRANGED'}" data-confirm="Record that you arranged the taxi outside RideMatch?" data-loading th:action="@{/rides/{id}/taxi-arranged(id=${group.ride.id})}" method="post"><button class="btn btn-outline-primary btn-sm" type="submit">Taxi arranged externally</button></form>
      <form data-confirm="Cancel this ride for the whole group? This action cannot be undone." data-loading th:action="@{/rides/{id}/cancel(id=${group.ride.id})}" method="post">
        <input name="reason" class="form-control form-control-sm mb-2" placeholder="Optional cancellation reason"><button class="btn btn-outline-danger btn-sm" type="submit">Cancel ride for group</button>
      </form>
    </div>
  </header>
  <div class="row g-3 mb-4">
    <div class="col-md-4"><div class="metric-card"><span class="metric-value" th:text="${group.fareSplit.confirmedPassengerCount}">0</span><span class="metric-label">Confirmed passengers</span></div></div>
    <div class="col-md-4"><div class="metric-card"><span class="metric-value" th:text="${group.ride.availableSeats}">0</span><span class="metric-label">Seats available</span></div></div>
    <div class="col-md-4"><div class="metric-card"><span class="metric-value" th:text="|₹${group.fareSplit.estimatedContributionEach}|">₹0</span><span class="metric-label">Estimated contribution each</span></div></div>
  </div>
  <section class="card"><div class="card-body">
    <div class="section-title"><h2>Group members and requests</h2><span class="small text-secondary" th:text="|Estimated total ₹${group.fareSplit.estimatedTotalFare}|">Estimated total</span></div>
    <p class="small text-secondary" th:text="${group.fareSplit.explanation}">Estimate only.</p>
    <div th:if="${group.memberships.isEmpty()}" class="empty-state">No membership records for this ride.</div>
    <div class="list-group list-group-flush" th:unless="${group.memberships.isEmpty()}">
      <article class="list-group-item px-0 py-3" th:each="member : ${group.memberships}">
        <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
          <div><strong th:text="${member.fullName}">Passenger</strong><span th:if="${member.userId == group.currentUserId}" class="text-secondary">(you)</span>
            <span class="badge ms-2" th:classappend="${member.status.name() == 'CONFIRMED'} ? ' badge-confirmed' : ' text-bg-light'" th:text="${member.status}">CONFIRMED</span>
            <span th:if="${member.userId == group.coordinatorUserId}" class="small text-secondary ms-1">Coordinator</span>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <form th:if="${group.coordinator and member.status.name() == 'REQUESTED'}" data-confirm="Approve this request and confirm a passenger seat?" data-loading th:action="@{/rides/{rideId}/memberships/{membershipId}/approve(rideId=${group.ride.id},membershipId=${member.membershipId})}" method="post"><button class="btn btn-success btn-sm" type="submit">Approve</button></form>
            <form th:if="${group.coordinator and member.status.name() == 'REQUESTED'}" data-confirm="Decline this join request?" data-loading th:action="@{/rides/{rideId}/memberships/{membershipId}/reject(rideId=${group.ride.id},membershipId=${member.membershipId})}" method="post"><button class="btn btn-outline-secondary btn-sm" type="submit">Decline</button></form>
            <form th:if="${member.userId == group.currentUserId and member.status.name() == 'INVITED'}" data-confirm="Accept this replacement invitation and confirm your seat?" data-loading th:action="@{/rides/{rideId}/memberships/{membershipId}/accept-invitation(rideId=${group.ride.id},membershipId=${member.membershipId})}" method="post"><button class="btn btn-primary btn-sm" type="submit">Accept invitation</button></form>
            <form th:if="${member.userId == group.currentUserId and member.status.name() == 'INVITED'}" data-confirm="Decline this replacement invitation?" data-loading th:action="@{/rides/{rideId}/memberships/{membershipId}/decline-invitation(rideId=${group.ride.id},membershipId=${member.membershipId})}" method="post"><button class="btn btn-outline-secondary btn-sm" type="submit">Decline</button></form>
            <form th:if="${member.userId == group.currentUserId and member.status.name() == 'CONFIRMED' and not group.coordinator}" data-confirm="Cancel your confirmed seat? The group will be notified and replacement search may begin." data-loading th:action="@{/rides/{rideId}/memberships/{membershipId}/cancel(rideId=${group.ride.id},membershipId=${member.membershipId})}" method="post"><input name="reason" type="hidden" value="Passenger cancelled membership"><button class="btn btn-outline-danger btn-sm" type="submit">Cancel membership</button></form>
            <form th:if="${member.userId == group.currentUserId and member.status.name() == 'REQUESTED'}" data-confirm="Withdraw your pending join request?" data-loading th:action="@{/rides/{rideId}/memberships/{membershipId}/cancel(rideId=${group.ride.id},membershipId=${member.membershipId})}" method="post"><input name="reason" type="hidden" value="Join request withdrawn"><button class="btn btn-outline-secondary btn-sm" type="submit">Withdraw request</button></form>
          </div>
        </div>
      </article>
    </div>
  </div></section>
  <div class="mt-3 d-flex gap-2 flex-wrap"><a class="btn btn-primary" th:href="@{/rides/search}">Find another ride</a><a class="btn btn-outline-secondary" th:href="@{/rides/my-rides}">My rides</a><a class="btn btn-outline-secondary" th:href="@{/ride-invitations}">Invitations</a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
