<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Request error')}"></head>
<body><nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="page-shell-narrow"><section class="card"><div class="card-body p-4">
  <span class="eyebrow" th:text="|Request error · ${status}|">Request error</span><h1 class="h3 mt-2">We couldn't complete that request</h1>
  <p class="text-secondary" th:text="${errorMessage}">Please try again.</p>
  <a class="btn btn-primary" th:href="@{/dashboard}">Return to dashboard</a>
</div></section></main>
<footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
