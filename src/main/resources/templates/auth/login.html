<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: publicNavigation}"></nav>
<main class="auth-shell">
  <section class="card"><div class="card-body">
    <span class="eyebrow">Welcome back</span><h1 class="h3 mt-2">Sign in</h1>
    <p class="text-secondary">Continue coordinating rides with your community.</p>
    <div th:if="${param.registered}" class="alert alert-success">Account created. Sign in to continue.</div>
    <div th:if="${param.logout}" class="alert alert-info">You have signed out.</div>
    <div th:if="${param.error}" class="alert alert-danger" role="alert">Email or password is incorrect.</div>
    <form method="post" th:action="@{/auth/login}" data-loading>
      <div class="mb-3"><label for="username" class="form-label">Email</label>
        <input id="username" name="username" type="email" class="form-control" autocomplete="username" required></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="mt-3 mb-0">New to RideMatch? <a th:href="@{/auth/register}">Create an account</a></p>
  </div></section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
