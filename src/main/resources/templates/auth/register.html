<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<nav th:replace="~{fragments/layout :: publicNavigation}"></nav>
<main class="auth-shell">
  <section class="card"><div class="card-body">
    <span class="eyebrow">Start sharing</span><h1 class="h3 mt-2">Create your account</h1>
    <p class="text-secondary">Use your college or company email where applicable. Community access is verified separately.</p>
    <form th:action="@{/auth/register}" th:object="${registrationRequest}" method="post" data-loading>
      <div class="mb-3"><label for="fullName" class="form-label">Full name</label>
        <input id="fullName" th:field="*{fullName}" class="form-control" autocomplete="name" required aria-describedby="fullNameError">
        <div id="fullNameError" class="text-danger small" th:errors="*{fullName}"></div></div>
      <div class="mb-3"><label for="email" class="form-label">Email</label>
        <input id="email" th:field="*{email}" type="email" class="form-control" autocomplete="email" required aria-describedby="emailError">
        <div id="emailError" class="text-danger small" th:errors="*{email}"></div></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label>
        <input id="password" th:field="*{password}" type="password" class="form-control" autocomplete="new-password" required aria-describedby="passwordHint passwordError">
        <div id="passwordHint" class="form-text">At least 12 characters with upper and lower case letters, a number, and a symbol.</div>
        <div id="passwordError" class="text-danger small" th:errors="*{password}"></div></div>
      <div class="mb-3"><label for="confirmPassword" class="form-label">Confirm password</label>
        <input id="confirmPassword" th:field="*{confirmPassword}" type="password" class="form-control" autocomplete="new-password" required aria-describedby="confirmPasswordError">
        <div id="confirmPasswordError" class="text-danger small" th:errors="*{confirmPassword}"></div></div>
      <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
    <p class="mt-3 mb-0">Already registered? <a th:href="@{/auth/login}">Sign in</a></p>
  </div></section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
